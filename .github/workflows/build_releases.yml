name: Build & Release Binary Executables

on:
  push:
    branches: [ main, cli-package ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, cli-package ]
  workflow_dispatch:

jobs:
  build:
    name: Build Binary for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: aegis-windows-amd64.exe
          - os: macos-14
            asset_name: aegis-darwin-arm64
          - os: macos-15-intel
            asset_name: aegis-darwin-amd64
          - os: ubuntu-latest
            asset_name: aegis-linux-amd64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # abetlen's own wheel index has prebuilt CPU wheels for this pin on
      # Windows/Linux/macOS-arm64, but not macOS-x86_64 (Intel) - that leg
      # falls through to a from-source CMake build. GGML_NATIVE=off is set
      # unconditionally (not just for the leg expected to source-compile)
      # because if any other leg silently falls back to a source build too,
      # skipping this flag would bake -march=native into a binary built on
      # the runner's CPU, which can crash with "illegal instruction" on an
      # end user's different CPU. GGML_METAL=off is scoped to macOS since
      # the flag doesn't apply elsewhere.
      #
      # NOTE: actions/setup-python's pip cache (above) persists pip's wheel
      # cache across runs. If a leg source-compiles and these CMAKE_ARGS are
      # changed later, the cached wheel from the old flags may be reused
      # silently - bust the cache (bump python-version or clear the Actions
      # cache) after changing CMAKE_ARGS here.
      - name: Install llama-cpp-python
        shell: bash
        run: |
          export CMAKE_ARGS="-DGGML_NATIVE=off"
          if [[ "${{ matrix.os }}" == macos* ]]; then
            export CMAKE_ARGS="$CMAKE_ARGS -DGGML_METAL=off"
          fi
          pip install --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu llama-cpp-python==0.3.34

      - name: Install Dependencies & PyInstaller
        run: |
          pip install -r requirements.txt
          pip install pyinstaller==6.22.0

      - name: Build Executable Binary
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: python build_installer.py

      - name: Rename Artifact for OS Matrix
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv dist/aegis.exe dist/${{ matrix.asset_name }}
          else
            mv dist/aegis dist/${{ matrix.asset_name }}
          fi

      # Ad-hoc signature only: satisfies Apple Silicon's bare-signature
      # requirement. Does NOT clear the com.apple.quarantine xattr set on
      # browser/curl-downloaded files - install.sh strips that client-side.
      # No Apple Developer ID is available, so real notarization is out of
      # scope for now. Must run before the smoke test below, not after -
      # otherwise the bytes actually executed and uploaded were never the
      # ones tested.
      - name: Ad-hoc Codesign (macOS)
        if: runner.os == 'macOS'
        run: codesign --force --deep -s - dist/${{ matrix.asset_name }}

      # Proves the eager import chain (textual/langgraph/langchain/litellm/
      # pydantic) is fully bundled - including litellm's eager
      # tiktoken.get_encoding("cl100k_base") call at import time, which is
      # the exact class of bug this catches (confirmed via a real CI failure
      # on macOS Intel: `ValueError: Unknown encoding cl100k_base` when
      # tiktoken_ext's plugin submodules aren't explicitly hidden-imported).
      # Does not exercise assets that are truly lazy (textual CSS at mount,
      # llama_cpp's native lib, which only loads if LLAMA_CPP_MODEL_PATH
      # points at a real file).
      - name: Smoke Test Binary
        shell: bash
        run: |
          chmod +x dist/${{ matrix.asset_name }} || true
          ./dist/${{ matrix.asset_name }} --help

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

      - name: Upload Binary to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}