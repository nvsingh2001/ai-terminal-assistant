name: Build & Release Binary Executables

on:
  push:
    branches: [ main, cli-package ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, cli-package ]
  workflow_dispatch:

jobs:
  build:
    name: Build Binary for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: cli-agent-windows-amd64.exe
            asset_name: cli-agent-windows-amd64.exe
          - os: macos-14
            artifact_name: cli-agent
            asset_name: cli-agent-darwin-arm64
          - os: macos-13
            artifact_name: cli-agent
            asset_name: cli-agent-darwin-amd64
          - os: ubuntu-latest
            artifact_name: cli-agent
            asset_name: cli-agent-linux-amd64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Build Executable Binary
        run: python build_installer.py

      - name: Rename Artifact for OS Matrix
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv dist/cli-agent.exe dist/${{ matrix.asset_name }}
          else
            mv dist/cli-agent dist/${{ matrix.asset_name }}
          fi

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

      - name: Upload Binary to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}