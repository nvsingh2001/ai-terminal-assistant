name: Real-Inference Eval Suite

# Opt-in only, unlike build_releases.yml's pytest gate: these tests hit a
# real hosted LLM API (cost + non-determinism), so they never run on every
# push/PR. Trigger manually via `gh workflow run eval_suite.yml` once
# OPENAI_API_KEY is set in repo secrets. No cron - avoid surprise billing
# until that's explicitly wanted later.
on:
  workflow_dispatch:

jobs:
  eval:
    name: DeepEval Agent Skill-Selection Evals
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Configure git identity for scratch-repo fixtures
        run: |
          git config --global user.email "eval@aegis.local"
          git config --global user.name "Aegis Eval"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Real-Inference Eval Suite
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: deepeval test run evals/ -v
